name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: "-linux"
          - goos: windows
            goarch: amd64
            suffix: "-windows.exe"
          - goos: darwin
            goarch: amd64
            suffix: "-darwin-amd64"
          - goos: darwin
            goarch: arm64
            suffix: "-darwin-arm64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # CGO_ENABLED=0: the exit-node/client binary only needs cgo for the
      # Android cross-build (via build_android.sh + the NDK toolchain), not
      # for these desktop/server targets.
      - name: Build optimized binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -trimpath -o openflux${{ matrix.suffix }} .

      - name: Upload binaries to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openflux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: openflux${{ matrix.suffix }}
          retention-days: 5 # Срок хранения артефактов (по умолчанию 90 дней, уменьшено для экономии места)
